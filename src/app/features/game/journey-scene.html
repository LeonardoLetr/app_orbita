<div
  #scene
  class="scene"
  [class.is-flying]="flying()"
  [class.is-sputtering]="sputtering()"
  [class.is-launching]="launching()"
  [class.is-liftoff]="liftoff()"
>
  <app-star-field />

  <div class="drift">
    <!-- Everything on the route moves together, down, as the rocket climbs. -->
    <div class="world">
      <div class="earth">
        <span class="land land-a"></span>
        <span class="land land-b"></span>
        <span class="land land-c"></span>
      </div>

      <!-- Rocks and comets adrift where no planet is near, moving on their own. -->
      @for (item of debris(); track item.at) {
        <span
          class="debris"
          [class.is-comet]="item.kind === 'comet'"
          [style.--at]="item.at"
          [style.--x]="item.x"
          [style.--d]="item.size"
          [style.--turn]="item.turn + 'deg'"
          [style.--period]="item.period + 's'"
          [style.--phase]="item.phase"
        ></span>
      }

      @for (stop of stops(); track stop.id) {
        <div
          class="stop"
          [class.is-right]="stop.side === 'right'"
          [class.is-lit]="stop.index <= litIndex()"
          [class.is-arriving]="stop.index === arrivingIndex()"
          [style.--at]="stop.at"
          [style.--d]="stop.size"
        >
          <app-planet-art class="stop-art" [planet]="stop.id" />
          <span class="stop-label">
            <b>{{ stop.name }}</b>
            <span>{{ stop.distance }}</span>
          </span>
        </div>
      }
    </div>
  </div>

  @if (launching()) {
    <app-launch-layers />
  }

  @if (arrival(); as stop) {
    <!-- The planet just passed, said out loud for a moment: a fast flight leaves little time to see it. -->
    <p class="arrival">
      <app-planet-art class="arrival-art" [planet]="stop.id" />
      <span
        >Você passou por <b>{{ stop.name }}</b
        >!</span
      >
    </p>
  }

  <app-exhaust-plume [anchor]="rocketTilt" />

  <div class="rocket">
    <div class="rocket-bob">
      <div #rocketTilt class="rocket-tilt">
        <app-rocket-art
          class="rocket-art"
          [upright]="true"
          [boosting]="flying() || liftoff()"
          [flame]="!exhaust()?.active()"
        />
      </div>
    </div>
  </div>
</div>
