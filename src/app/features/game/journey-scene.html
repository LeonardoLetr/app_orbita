<div
  class="scene"
  [class.is-flying]="flying()"
  [class.is-sputtering]="sputtering()"
  [style.--pos]="position()"
  [style.--flight]="flightMs() + 'ms'"
>
  <div class="stars stars-far"></div>
  <div class="stars stars-near"></div>
  <div class="speed-lines"></div>

  <!-- Everything on the route moves together, down, as the rocket climbs. -->
  <div class="world">
    <div class="earth">
      <span class="land land-a"></span>
      <span class="land land-b"></span>
      <span class="land land-c"></span>
    </div>

    @for (stop of stops; track stop.id) {
      <div
        class="stop"
        [class.is-right]="stop.side === 'right'"
        [class.is-lit]="stop.index <= litIndex()"
        [class.is-arriving]="stop.index === arrivingIndex()"
        [style.--i]="stop.index"
        [style.--d]="stop.size"
      >
        <app-planet-art class="stop-art" [planet]="stop.id" />
        <span class="stop-label">
          <b>{{ stop.name }}</b>
          <span>{{ stop.distance }}</span>
        </span>
      </div>
    }
  </div>

  <div class="rocket">
    <div class="rocket-bob">
      <div class="rocket-tilt">
        <span class="trail"></span>
        <span class="spark" style="--x: -18%; animation-delay: 0ms"></span>
        <span class="spark" style="--x: 14%; animation-delay: 160ms"></span>
        <span class="spark" style="--x: -4%; animation-delay: 320ms"></span>
        <span class="spark" style="--x: 22%; animation-delay: 480ms"></span>
        <span class="puff"></span>
        <span class="puff" style="animation-delay: 120ms"></span>
        <span class="puff" style="animation-delay: 240ms"></span>
        <app-rocket-art class="rocket-art" [upright]="true" [boosting]="flying()" />
      </div>
    </div>
  </div>
</div>
